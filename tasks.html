<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My Tasks</h1>
    <p>Student Task Manager · saved in the Supabase database</p>
  </header>

  <main>
    <p id="configWarning" class="error" hidden></p>

    <!-- Login: shown when nobody is logged in -->
    <section id="authSection" hidden>
      <h2>Log in</h2>
      <form id="authForm" class="task-form" novalidate>
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email">

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password">

        <button type="submit" id="loginButton">Log in</button>
        <button type="button" id="signupButton" class="secondary">Create account</button>
        <p id="authError" class="error"></p>
        <p id="authInfo" class="success"></p>
      </form>
    </section>

    <!-- Tasks: shown when a user is logged in -->
    <div id="appSection" hidden>
      <section>
        <p class="user-bar">
          Logged in as <strong id="userEmail"></strong>
          <button type="button" id="logoutButton" class="link-button">Log out</button>
        </p>
        <h2>Add a task</h2>
        <form id="taskForm" class="task-form" novalidate>
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="For example: Read chapter 3">
          <p id="titleError" class="error field-error"></p>

          <button type="submit">Add</button>
          <p id="error" class="error"></p>
          <p id="success" class="success"></p>
        </form>
      </section>

      <section>
        <h2>Task list</h2>
        <ul id="taskList" class="task-list"></ul>
      </section>
    </div>

    <p><a href="index.html">Back to the project page</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- type="module": our own "const supabase" then does not clash with the global "supabase" of the library -->
  <script type="module" src="tasks.js"></script>
</body>
</html>
