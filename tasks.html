<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My Tasks</h1>
    <p>Student Task Manager</p>
  </header>

  <main>
    <section>
      <h2>Add a task</h2>
      <form id="taskForm" class="task-form" novalidate>
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="For example: Read chapter 3">
        <p id="titleError" class="error field-error"></p>

        <label for="dueDate">Due date</label>
        <input type="date" id="dueDate">
        <p id="dueDateError" class="error field-error"></p>

        <label for="priority">Priority</label>
        <select id="priority">
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High</option>
        </select>

        <label for="category">Category</label>
        <select id="category">
          <option value="Studies">Studies</option>
          <option value="Work">Work</option>
          <option value="Home">Home</option>
          <option value="Other">Other</option>
        </select>

        <button type="submit">Add</button>
        <p id="error" class="error"></p>
        <p id="success" class="success"></p>
      </form>
    </section>

    <section>
      <h2>Task list</h2>
      <ul id="taskList" class="task-list"></ul>
    </section>

    <p><a href="index.html">Back to the project page</a></p>
  </main>

  <script src="tasks.js"></script>
</body>
</html>
